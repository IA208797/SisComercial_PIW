<div class="min-h-screen bg-marca-hielo p-4 lg:p-8 font-sans text-marca-gris  ">
  <form [formGroup]="pedidoForm" (ngSubmit)="onSubmit()" class="max-w-6xl mx-auto">

    <h1 class="text-3xl font-black mb-8 text-marca-azul">Tu carrito</h1>

    <div class="flex flex-col lg:flex-row gap-8">

      <div class="w-full lg:w-2/3">
        <div formArrayName="articulos" class="space-y-4">

          <div *ngFor="let articulo of articulos.controls; let i = index" [formGroupName]="i"
            class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col sm:flex-row gap-4 items-center relative transition hover:shadow-md">

            <div
              class="w-24 h-24 bg-marca-hielo rounded-xl flex items-center justify-center text-turquesa border border-gray-100 shrink-0">
              <img *ngIf="articulo.get('productoId')?.value; else placeholderSvg"
                [src]="obtenerImagenProducto(articulo.get('productoId')?.value)" alt="Vista previa del producto"
                class="w-full h-full object-cover rounded-2xl">

              <ng-template #placeholderSvg>
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
                  </path>
                </svg>
              </ng-template>

            </div>

            <div class="flex-1 w-full">
              <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Producto #{{ i + 1
                }}</label>
              <select formControlName="productoId" (change)="calcularTotal()"
                class="w-full border border-gray-200 rounded-lg p-2.5 focus:outline-none focus:border-turquesa focus:ring-2 focus:ring-turquesa/20 text-marca-gris font-medium bg-white">
                <option value="" disabled selected>Selecciona un artículo</option>
                <option *ngFor="let prod of catalogoProductos" [value]="prod._id">
                  {{ prod.nombre }} - (${{ prod.precio }})
                </option>
              </select>
            </div>

            <div class="flex sm:flex-col items-center gap-3 w-full sm:w-auto mt-2 sm:mt-0">
              <div class="flex-1 sm:flex-none">
                <label
                  class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1 hidden sm:block text-center">Cant.</label>
                <input type="number" formControlName="cantidad" (input)="calcularTotal()" min="1"
                  class="w-full sm:w-20 text-center border border-gray-200 p-2 rounded-lg focus:outline-none focus:border-turquesa focus:ring-2 focus:ring-turquesa/20 font-bold text-marca-azul">
              </div>

              <button type="button" (click)="eliminarArticulo(i)" *ngIf="articulos.length > 0"
                class="bg-marca-naranja hover:bg-orange-600 text-white text-sm font-bold px-4 py-2 rounded-lg transition w-full sm:w-auto shadow-sm">
                Eliminar
              </button>
            </div>
          </div>
        </div>

        <div class="mt-6 text-center sm:text-left">
          <button type="button" (click)="agregarArticulo()"
            class="bg-marca-naranja hover:bg-orange-600 text-white font-bold py-2.5 px-8 rounded-lg shadow-md transition">
            + Añadir Producto
          </button>
        </div>
      </div>

      <div class="w-full lg:w-1/3">
        <div class="bg-white rounded-2xl shadow-lg p-6 border-t-8 border-marca-azul sticky top-6">
          <h2 class="text-xl font-bold mb-6 text-marca-gris">Resumen de la orden</h2>

          <div class="space-y-4 mb-6">
            <div>
              <!-- Cuando este lo de perla hay que cambiar esta seccion para obtener el nombre del cliente en base a la base de datos -->
              <div>
                <label class="block text-sm font-bold mb-1 text-marca-azul">Cliente</label>

                <div class="w-full border border-gray-200 rounded-lg p-2.5 bg-marca-hielo text-black font-medium">
                  {{ nombreCliente }}
                </div>

              </div>
              <!-- Cuando este lo de perla hay que cambiar esta seccion para obtener el nombre del cliente en base a la base de datos -->
            </div>

            <div>
              <label class="block text-sm font-bold mb-1 text-marca-azul">Notas adicionales:</label>
              <textarea formControlName="notas" placeholder="Ej. La sandiada de mango..." rows="3"
                class="w-full border border-gray-200 rounded-lg p-2.5 focus:outline-none focus:border-turquesa focus:ring-2 focus:ring-turquesa/20 bg-marca-hielo resize-none text-sm"></textarea>
            </div>
          </div>

          <hr class="border-gray-100 mb-4">

          <div class="flex justify-between items-center mb-6 bg-marca-hielo p-4 rounded-xl border border-gray-100">
            <span class="text-lg font-bold text-marca-gris">Total:</span>
            <span class="text-3xl font-black text-marca-azul">${{ totalVisual }}</span>
          </div>

          <button type="submit" [disabled]="pedidoForm.invalid"
            class="w-full bg-marca-naranja hover:bg-orange-600 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-bold py-3.5 px-4 rounded-xl text-lg transition shadow-md">
            Confirmar Pedido
          </button>
        </div>
      </div>

    </div>
  </form>
</div>
