<header class="bg-marca-azul text-white shadow-md font-roboto relative z-50">
  <div class="mx-auto flex max-w-screen-2xl items-center justify-between px-8 py-4">

    <a routerLink="/menu"
      class="text-2xl font-bold font-merriweather tracking-wide transition hover:text-marca-turquesa">
      Tiendita
    </a>

    <nav class="flex items-center gap-2 text-sm font-semibold">

      <a routerLink="/menu" routerLinkActive="bg-[#F97316]" [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-xl px-4 py-2 transition hover:bg-marca-turquesa/20 hover:text-marca-turquesa">
        Menú
      </a>

      <div class="relative group py-2">
        <button type="button"
          class="flex items-center gap-1 rounded-xl px-4 py-2 transition hover:bg-marca-turquesa/20 hover:text-marca-turquesa cursor-pointer outline-none">
          <span>Admin</span>
          <svg class="w-4 h-4 transition-transform group-hover:rotate-180" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <div
          class="absolute left-0 mt-1 w-48 rounded-xl bg-white p-2 shadow-xl border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 transform translate-y-2 group-hover:translate-y-0">
          <a routerLink="/admin/dashboard" routerLinkActive="text-marca-azul bg-teal-50"
            class="flex items-center gap-2 px-4 py-2.5 text-sm text-marca-gris hover:text-marca-azul hover:bg-teal-50/60 rounded-lg transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
              stroke="currentColor" class="size-6">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M3.75 3v11.25A2.25 2.25 0 0 0 6 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0 1 18 16.5h-2.25m-7.5 0h7.5m-7.5 0-1 3m8.5-3 1 3m0 0 .5 1.5m-.5-1.5h-9.5m0 0-.5 1.5m.75-9 3-3 2.148 2.148A12.061 12.061 0 0 1 16.5 7.605" />
            </svg>

            <span>Dashboard</span>
          </a>
          <a routerLink="/admin/productos" routerLinkActive="text-marca-azul bg-teal-50"
            class="flex items-center gap-2 px-4 py-2.5 text-sm text-marca-gris hover:text-marca-azul hover:bg-teal-50/60 rounded-lg transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
              stroke="currentColor" class="size-6">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z" />
            </svg>
            Inventario
          </a>
          <a routerLink="/admin/pedidos" routerLinkActive="text-marca-azul bg-teal-50"
            class="flex items-center gap-2 px-4 py-2.5 text-sm text-marca-gris hover:text-marca-azul hover:bg-teal-50/60 rounded-lg transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
              stroke="currentColor" class="size-6">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
            </svg>

            Pedidos
          </a>
        </div>
      </div>

      <a routerLink="/cliente/pedidos" routerLinkActive="bg-[#F97316]"
        class="rounded-xl px-4 py-2 transition hover:bg-marca-turquesa/20 hover:text-marca-turquesa">
        Pedidos
      </a>

      <div class="relative group py-2">
        <button type="button"
          class="flex items-center gap-1 rounded-xl px-4 py-2 transition hover:bg-marca-turquesa/20 hover:text-marca-turquesa cursor-pointer outline-none">
          <span>Clientes</span>
          <svg class="w-4 h-4 transition-transform group-hover:rotate-180" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <div
          class="absolute right-0 mt-1 w-48 rounded-xl bg-white p-2 shadow-xl border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 transform translate-y-2 group-hover:translate-y-0">
          <a routerLink="/cliente/cuenta" routerLinkActive="text-marca-azul bg-teal-50"
            class="flex items-center gap-2 px-4 py-2.5 text-sm text-marca-gris hover:text-marca-azul hover:bg-teal-50/60 rounded-lg transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
              stroke="currentColor" class="size-6">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
            </svg>
            Mi Cuenta
          </a>
          <a routerLink="/cliente/canje" routerLinkActive="text-marca-azul bg-teal-50"
            class="flex items-center gap-2 px-4 py-2.5 text-sm text-marca-gris hover:text-marca-azul hover:bg-teal-50/60 rounded-lg transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
              stroke="currentColor" class="size-6">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M21 11.25v8.25a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5v-8.25M12 4.875A2.625 2.625 0 1 0 9.375 7.5H12m0-2.625V7.5m0-2.625A2.625 2.625 0 1 1 14.625 7.5H12m0 0V21m-8.625-9.75h18c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125h-18c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z" />
            </svg>
            Canje de Puntos
          </a>
        </div>
      </div>

    </nav>
  </div>
</header>
