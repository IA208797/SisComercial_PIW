<header class="bg-[#0F766E] text-white shadow-md font-roboto relative z-50">
  <div class="mx-auto flex max-w-screen-2xl items-center justify-between px-8 py-4">
    
    <a routerLink="/menu" class="text-2xl font-bold font-merriweather tracking-wide transition hover:text-[#2DD4BF]">
      Tiendita
    </a>

    <nav class="flex items-center gap-2 text-sm font-semibold">
      
      <a
        routerLink="/menu"
        routerLinkActive="bg-[#F97316]"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-xl px-4 py-2 transition hover:bg-[#2DD4BF]/20 hover:text-[#2DD4BF]"
      >
        Menú
      </a>

      <div class="relative group py-2">
        <button 
          type="button"
          class="flex items-center gap-1 rounded-xl px-4 py-2 transition hover:bg-[#2DD4BF]/20 hover:text-[#2DD4BF] cursor-pointer outline-none"
        >
          <span>Admin</span>
          <svg class="w-4 h-4 transition-transform group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <div class="absolute left-0 mt-1 w-48 rounded-xl bg-white p-2 shadow-xl border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 transform translate-y-2 group-hover:translate-y-0">
          <a 
            routerLink="/admin/dashboard" 
            routerLinkActive="text-[#0F766E] bg-teal-50"
            class="block px-4 py-2.5 text-sm text-[#1E293B] hover:text-[#0F766E] hover:bg-teal-50/60 rounded-lg transition-colors"
          >
            📊 Dashboard
          </a>
          <a 
            routerLink="/admin/productos" 
            routerLinkActive="text-[#0F766E] bg-teal-50"
            class="block px-4 py-2.5 text-sm text-[#1E293B] hover:text-[#0F766E] hover:bg-teal-50/60 rounded-lg transition-colors"
          >
            📦 Inventario
          </a>
        </div>
      </div>

      <a 
        routerLink="/pedidos" 
        routerLinkActive="bg-[#F97316]"
        class="rounded-xl px-4 py-2 transition hover:bg-[#2DD4BF]/20 hover:text-[#2DD4BF]"
      > 
        Pedidos 
      </a>

      <div class="relative group py-2">
        <button 
          type="button"
          class="flex items-center gap-1 rounded-xl px-4 py-2 transition hover:bg-[#2DD4BF]/20 hover:text-[#2DD4BF] cursor-pointer outline-none"
        >
          <span>Clientes</span>
          <svg class="w-4 h-4 transition-transform group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <div class="absolute right-0 mt-1 w-48 rounded-xl bg-white p-2 shadow-xl border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 transform translate-y-2 group-hover:translate-y-0">
          <a 
            routerLink="/cliente/cuenta" 
            routerLinkActive="text-[#0F766E] bg-teal-50"
            class="block px-4 py-2.5 text-sm text-[#1E293B] hover:text-[#0F766E] hover:bg-teal-50/60 rounded-lg transition-colors"
          >
            👤 Mi Cuenta
          </a>
          <a 
            routerLink="/cliente/canje" 
            routerLinkActive="text-[#0F766E] bg-teal-50"
            class="block px-4 py-2.5 text-sm text-[#1E293B] hover:text-[#0F766E] hover:bg-teal-50/60 rounded-lg transition-colors"
          >
            🎁 Canje de Puntos
          </a>
        </div>
      </div>

    </nav>
  </div>
</header>
